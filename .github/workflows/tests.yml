# Pasa todos los tests en cada PR a develop y main, y en cada push a cualquier rama.
# Los tests no usan red ni clave de Gemini (tools falsas, LLM falso y monkeypatch), así que no hace falta ningún secreto.
# En cada push a main, si los tests pasan, avisa a Render para que redespliegue (deploy hook).
name: Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ["**"]

concurrency:  # si se sube otro commit a la misma PR, se cancela la ejecución anterior
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # torch solo CPU: la versión por defecto en Linux trae CUDA (~2 GB) y los tests no la necesitan
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ejecutar los tests
        run: python -m pytest -q

  deploy:
    # Solo en push a main y solo si los tests han pasado: así a producción nunca llega un main roto.
    # RENDER_DEPLOY_HOOK es la URL secreta de Render (servicio → Settings → Deploy Hook), guardada en
    # GitHub → Settings → Secrets and variables → Actions. Nunca va en el repo ni en los logs.
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Redesplegar en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK: no se redespliega."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render avisado: el redespliegue de main está en marcha."
